          format: date-time
          description: ISO 8601 timestamp when the reward was paid (only present when status is "paid")
          example: "2024-01-20T14:45:00Z"

    DealProgressResponse:
      type: object
      required:
        - totalPaidUsdc
        - periodsPaid
        - remainingPeriods
        - nextDueDate
        - equityAccumulatedUsdc
        - equityCapUsdc
        - equityPercentageBps
        - equityPaymentsConfirmed
      properties:
        totalPaidUsdc:
          type: string
          description: Total USDC paid across all confirmed on-chain TENANT_REPAYMENT receipts (decimal string with 6 decimal places)
          example: "129.040000"
        periodsPaid:
          type: integer
          description: Number of TENANT_REPAYMENT receipts confirmed on-chain
          example: 2
        remainingPeriods:
          type: integer
          description: Number of remaining repayment periods (termMonths minus periodsPaid, clamped to >= 0)
          example: 10
        nextDueDate:
          type: string
          format: date-time
          nullable: true
          description: ISO 8601 due date of the next scheduled payment; null if fully paid
          example: "2024-04-15T00:00:00.000Z"
        lastPaymentTxId:
          type: string
          description: txId (SHA-256 hex) of the most recent confirmed receipt
          example: "a3f2c1d4e5b6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2"
        lastPaymentExternalRefSource:
          type: string
          description: Source part of the canonical external reference (e.g. "stripe", "manual")
          example: stripe
        lastPaymentExternalRef:
          type: string
          description: Reference part of the canonical external reference (e.g. payment intent ID)
          example: pi_3OZxyz123456
        equityAccumulatedUsdc:
          type: string
          description: |
            Rent-to-own equity confirmed on-chain — sum of `sent`
            RENT_TO_OWN_EQUITY_PAYMENT receipts' equityAmountUsdc (decimal
            string, 6 decimal places). Reflects record_equity_payment calls
            that actually landed on the rent_to_own contract.
          example: "80.650000"
        equityCapUsdc:
          type: string
          description: rent_to_own's property_value_usdc equity cap for this deal (decimal string, 6 decimal places)
          example: "600.000000"
        equityPercentageBps:
          type: integer
          description: equityAccumulatedUsdc as basis points of equityCapUsdc (0-10000), mirroring the contract's get_equity_percentage
          example: 1344
        equityPaymentsConfirmed:
          type: integer
          description: Number of RENT_TO_OWN_EQUITY_PAYMENT receipts confirmed on-chain
          example: 2

