  /api/deposits/confirm:
    post:
      summary: Confirm a fiat deposit and convert it
      description: |
        Confirms an NGN deposit, idempotent by `depositId`, and converts it to USDC once. Returns the deposit and the conversion. The implementation does not authenticate the caller: it is meant to be reached by trusted services, so it should not be exposed publicly.
      operationId: confirmDeposit
      tags:
        - Deposits
      security: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: A UUID. Retrying with the same key and body replays the first response; the same key with a different body is 409. The legacy `x-idempotency-key` header is also accepted.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [depositId, userId, amountNgn, provider, providerRef]
              properties:
                depositId: { type: string, description: 'Canonical deposit identifier: {provider}:{id}' }
                userId: { type: string }
                amountNgn: { type: number, exclusiveMinimum: 0 }
                provider: { type: string, enum: [onramp, offramp, manual_admin] }
                providerRef: { type: string, description: Provider reference for reconciliation }
      responses:
        '200':
          description: Deposit confirmed and converted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  deposit: { type: object, additionalProperties: true }
                  conversion: { type: object, additionalProperties: true }
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'


  /api/staking/finalize:
