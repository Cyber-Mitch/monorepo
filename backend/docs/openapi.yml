                  hold:
                    type: object
                    properties:
                      id:
                        type: string
                      accountId:
                        type: string
                      assessmentId:
                        type: string
                      holdType:
                        type: string
                        enum: [full, partial, transaction_limit]
                      holdReason:
                        type: string
                      releasedAt:
                        type: string
                        format: date-time
                      releasedBy:
                        type: string
                      releaseReason:
                        type: string
                      createdAt:
                        type: string
                        format: date-time
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Hold not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
