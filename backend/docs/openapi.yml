  - name: Multisig
    description: |
      M-of-N approval for privileged on-chain admin actions. When `MULTISIG_ADMIN_ID` is set, the
      circuit-breaker drain (`propose-drain`, `execute-drain`) and contract-access role assignment
      (`propose-assign-role`) admin endpoints file a proposal here and answer 202 with a `multisig`
      object instead of executing; `freeze` stays immediate. The drain endpoints then need a
      `drainHash` (64 hex characters), as the deal_escrow contract's drain functions take one.
