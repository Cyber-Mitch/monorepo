          in: query
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: A page of account holds
          content:
            application/json:
              schema:
                type: object
                required:
                  - holds
                properties:
                  holds:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        accountId:
                          type: string
                        assessmentId:
                          type: string
                        holdType:
                          type: string
                          enum: [full, partial, transaction_limit]
                        holdReason:
                          type: string
                        releasedAt:
                          type: string
                          format: date-time
                          nullable: true
                        releasedBy:
                          type: string
                          nullable: true
                        releaseReason:
                          type: string
                          nullable: true
                        createdAt:
                          type: string
                          format: date-time
