  /api/admin/withdrawals:
    get:
      summary: List NGN withdrawals
      description: |
        Every user's withdrawals, newest first, so admins can see what is waiting for approval.
        Filter with `status`; page with `limit` (1-100, default 20) and the `nextCursor` from the
        previous page. Requires the payouts:trigger permission, as approve and reject do. (#1944)
      operationId: listNgnWithdrawals
      tags:
        - Admin
      security:
        - bearerAdminAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, processing, confirmed, failed, rejected]
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: A page of withdrawals
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/WithdrawalResponse'
                            - type: object
                              properties:
                                userId: { type: string }
                                approvedBy: { type: string, nullable: true }
                                approvedAt: { type: string, format: date-time, nullable: true }
                      nextCursor: { type: string, nullable: true }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'

  /api/admin/withdrawals/{id}/approve:
    post:
      summary: Approve NGN withdrawal
      description: Moves a pending withdrawal to approved and queues it for provider payout, recording who approved it. The payout worker sends the transfer and settles the withdrawal to confirmed or failed. Approval does not move money. Idempotent if already approved or settled.
      operationId: approveNgnWithdrawal
      tags:
        - Admin
      # requirePermission('payouts', 'trigger') in code — admin-tier RBAC permission,
      # not just an authenticated session. See bearerAdminAuth description.
      security:
        - bearerAdminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Withdrawal approved/confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is authenticated but lacks the payouts:trigger permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'

  /api/admin/withdrawals/{id}/reject:
    post:
      summary: Reject NGN withdrawal
      description: Rejects a pending withdrawal and releases held funds back to available. Idempotent if already rejected/failed.
      operationId: rejectNgnWithdrawal
      tags:
        - Admin
      # requirePermission('payouts', 'trigger') in code — admin-tier RBAC permission,
      # not just an authenticated session. See bearerAdminAuth description.
      security:
        - bearerAdminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Withdrawal rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is authenticated but lacks the payouts:trigger permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'

