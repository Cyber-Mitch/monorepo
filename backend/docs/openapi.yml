        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'


  /api/staking/stake-ngn:
    post:
      summary: Stake directly from the NGN wallet
      description: |
        Reserves `amountNgn` in the caller's NGN wallet, converts it to USDC, debits the reservation and writes the staking receipt. Idempotent by `(externalRefSource, externalRef)`: repeating it returns 200 `Staking already processed` once the conversion completed, or 202 `Staking in progress`. 400 when the balance is too low or the amount is under 100 NGN.
      operationId: stakeFromNgn
      tags:
        - Staking
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: A UUID. Retrying with the same key and body replays the first response; the same key with a different body is 409. The legacy `x-idempotency-key` header is also accepted.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountNgn, externalRefSource, externalRef]
              properties:
                amountNgn: { type: number, minimum: 100 }
                externalRefSource: { type: string, pattern: '^[a-zA-Z0-9_-]+$', description: 'Source identifier, e.g. web or mobile' }
                externalRef: { type: string, minLength: 1, description: Reference for idempotency, e.g. a UUID }
      responses:
        '200':
          description: Staked (or already processed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  conversionId: { type: string }
                  amountUsdc: { type: string }
                  outboxId: { type: string }
                  txId: { type: string }
                  status: { type: string }
        '202':
          description: Staking in progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  status: { type: string }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'


  /api/staking/history:
    get:
      summary: List the caller's staking activity
      description: |
        Stake, unstake and reward-claim receipts for the caller's wallet, newest first (at most 100 sent and 100 received are considered). The wallet is taken from the `x-wallet-address` header, else the custodial wallet, else the linked wallet; 400 when none exists. Returns an empty list when no receipt index is available.
      operationId: getStakingHistory
      tags:
