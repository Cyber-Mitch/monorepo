    EarningsHistoryItem:
      type: object
      required:
        - rewardId
        - listingId
        - dealId
        - amountNgn
        - amountUsdc
        - status
        - createdAt
      properties:
        rewardId:
          type: string
          description: Unique identifier for the reward
          example: "rw-001"
        listingId:
          type: string
          description: Identifier of the reported listing
          example: "lst-456"
        dealId:
          type: string
          description: Identifier of the associated deal
          example: "deal-789"
        amountNgn:
          type: number
          format: double
          description: Reward amount in Nigerian Naira
          example: 300000
