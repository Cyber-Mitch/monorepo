      responses:
        '200':
          description: Staking history
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  history:
                    type: array
                    items:
                      type: object
                      properties:
                        txId: { type: string }
                        txType: { type: string }
                        amountUsdc: { type: string }
