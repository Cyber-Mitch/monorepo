            example:
              amountUsdc: "1000.000000"
              externalRefSource: manual
              externalRef: stake-2024-01-15-001
      responses:
        '200':
          description: Staking confirmed and receipt written to chain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StakingResponse'
              example:
