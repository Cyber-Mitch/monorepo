  /api/admin/fraud/assessments:
    get:
      summary: List fraud assessments
      description: |
        Returns fraud assessments newest first, with optional filtering by risk
        level, decision (action taken), and date range. Supports page-based
        pagination via `page` and `pageSize` (or legacy `limit`/`offset`).
      operationId: listFraudAssessments
      tags:
        - Admin
      security:
        - bearerAdminAuth: []
      parameters:
        - name: riskLevel
          in: query
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: decision
          in: query
          description: Filter by the action taken during assessment
          schema:
            type: string
            enum: [none, hold, block, review_queue]
        - name: from
          in: query
          description: Only assessments assessed at or after this ISO 8601 timestamp
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Only assessments assessed at or before this ISO 8601 timestamp
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: A page of fraud assessments
          content:
            application/json:
              schema:
                type: object
                required:
                  - assessments
                properties:
                  assessments:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        entityType:
                          type: string
                          enum: [account, payment, transaction]
                        entityId:
                          type: string
                        totalScore:
                          type: integer
                        riskLevel:
                          type: string
                          enum: [low, medium, high, critical]
                        actionTaken:
                          type: string
                          enum: [none, hold, block, review_queue]
                          nullable: true
                        signalMatches:
                          type: array
                          items:
                            type: object
                        context:
                          type: object
                        assessedAt:
                          type: string
                          format: date-time
                        createdAt:
                          type: string
                          format: date-time
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'

