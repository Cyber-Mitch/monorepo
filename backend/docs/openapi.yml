                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required:
                      - disputes
                    properties:
                      disputes:
                        type: array
                        items:
                          $ref: '#/components/schemas/PaymentDispute'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'

