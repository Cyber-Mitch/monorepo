        Writes the on-chain staking receipt for a completed conversion. Idempotent by `conversionId`. 200 when the receipt was written, 202 when it was queued for retry; 503 when the staking service is unavailable. The implementation does not authenticate the caller: it is meant for trusted services.
      operationId: finalizeStaking
      tags:
        - Staking
      security: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: A UUID. Retrying with the same key and body replays the first response; the same key with a different body is 409. The legacy `x-idempotency-key` header is also accepted.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversionId]
              properties:
                conversionId: { type: string, minLength: 1 }
      responses:
        '200':
          description: Finalized and receipt written
