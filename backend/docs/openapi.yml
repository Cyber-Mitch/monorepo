openapi: 3.0.3
info:
  title: ShelterFlex Backend API
  description: API for ShelterFlex backend service
  version: 0.1.0
  contact:
    name: ShelterFlex Team
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:4000
    description: Development server
  - url: https://api.shelterflex.io
    description: Production server

paths:
  /health:
    get:
      summary: Health check endpoint
      description: Returns the current health status and basic service information
      operationId: getHealth
      tags:
        - Health
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - version
                  - uptimeSeconds
                properties:
                  status:
                    type: string
                    enum: [ok]
                    example: ok
                  version:
                    type: string
                    example: "0.1.0"
                  uptimeSeconds:
                    type: number
                    format: int64
                    example: 3600
                  stubbedIntegrations:
                    type: array
                    description: Integrations resolving to a stub or mock, including those opted out via ALLOW_STUB_PROVIDERS (#1942)
                    items:
                      type: string
                    example: [rentGuarantee]
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"

  /api/auth/request-otp:
    post:
      summary: Request OTP for email login
      description: Sends a one-time password (OTP) to the provided email address.
      operationId: requestOtp
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: OTP request accepted
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: OTP sent to your email
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"

  /api/auth/verify-otp:
    post:
      summary: Verify OTP and create session
      description: Verifies the OTP for the email and returns a session token (Bearer).
      operationId: verifyOtp
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
                  minLength: 6
                  maxLength: 6
      responses:
        "200":
          description: OTP verified successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - token
                  - user
                properties:
                  token:
                    type: string
                    description: "Session token to be used as Authorization: Bearer <token>"
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/Error"

  /api/auth/logout:
    post:
      summary: Logout
      description: Invalidates the current session token.
      operationId: logout
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: Logged out
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"

  /api/auth/me:
    get:
      summary: Get current authenticated user
      description: Returns the current user associated with the Bearer session token.
      operationId: getMe
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/user/preferences/notifications/messages-email:
    patch:
      summary: Update message email preference
      description: Opt in or out of delayed message email notifications.
      operationId: updateMessageEmailPreference
      tags:
        - User Preferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - enabled
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: Preference updated
          content:
            application/json:
              schema:
                type: object
                required:
                  - messageEmailsEnabled
                properties:
                  messageEmailsEnabled:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"

  /api/auth/wallet/challenge:
    post:
      summary: Create wallet login challenge
      description: Returns a Stellar SEP-10 style challenge XDR for the wallet to sign.
      operationId: walletChallenge
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletChallengeRequest'
      responses:
        "200":
          description: Challenge created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletChallengeResponse'
        "400":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/Error"

  /api/auth/wallet/verify:
    post:
      summary: Verify wallet login signature
      description: Verifies a signed challenge XDR and creates a session token.
      operationId: walletVerify
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletVerifyRequest'
      responses:
        "200":
          description: Wallet verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        "400":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/Error"

  /api/risk/state:
    get:
      summary: Get current user risk state
      description: Returns whether the authenticated user is frozen and any freeze reason.
      operationId: getRiskState
      tags:
        - Risk
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Risk state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskStateResponse'
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"

  /api/admin/jobs/health:
    get:
      summary: Scheduled job and worker health
      description: >-
        Health of every scheduled job and background worker: what it does, when
        it last ran, how long that run took, how many records it processed, and
        whether it is overdue. A job that has stopped being scheduled reports
        state "overdue" (or "never_ran") so a missing run is detectable as an
        absence rather than only as an error. Requires an admin session with the
        jobs:view permission.
      operationId: getJobHealth
      tags:
        - Admin
      security:
        - bearerAdminAuth: []
      responses:
        "200":
          description: Job health report
          content:
            application/json:
              schema:
                type: object
                required: [capturedAt, overdueCount, failingCount, jobs]
                properties:
                  capturedAt:
                    type: string
                    format: date-time
                  overdueCount:
                    type: integer
                  failingCount:
                    type: integer
                  jobs:
                    type: array
                    items:
                      type: object
                      required: [name, module, does, expectedIntervalMs, state, overdue]
                      properties:
                        name:
                          type: string
                        module:
                          type: string
                        does:
                          type: string
                        expectedIntervalMs:
                          type: integer
                        ifItDoesNotRun:
                          type: string
                        healthy:
                          type: string
                        state:
                          type: string
                          enum: [healthy, failing, overdue, never_ran]
                        overdue:
                          type: boolean
                        secondsSinceLastRun:
                          type: integer
                          nullable: true
                        lastSuccessAt:
                          type: string
                          format: date-time
                          nullable: true
                        consecutiveFailures:
                          type: integer
                        lastRun:
                          type: object
                          nullable: true
                          properties:
                            startedAt:
                              type: string
                              format: date-time
                            finishedAt:
                              type: string
                              format: date-time
                            durationMs:
                              type: integer
                            outcome:
                              type: string
                              enum: [completed, failed, skipped_overrun]
                            recordsProcessed:
                              type: integer
                            correlationId:
                              type: string
                              nullable: true
                            error:
                              type: string
        "403":
          description: Invalid admin secret
        default:
          $ref: "#/components/responses/Error"

  /api/admin/receipts:
    get:
      summary: Query indexed receipts
      description: >-
        Query receipts indexed off-chain (no Soroban call). Note: despite the
        /admin path prefix, this endpoint only requires an authenticated
        session (authenticateToken) — the route handler does not check for an
        admin role.
      operationId: queryReceipts
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: dealId
          in: query
          required: false
          schema:
            type: string
        - name: txType
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paged receipts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedReceipts'
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"

  /api/deals/{dealId}/receipts:
    get:
      summary: List receipts for a deal
      description: >-
        Returns all receipts for a deal. Note: the route has no auth
        middleware today (see PR description — code/spec mismatch finding).
      operationId: listDealReceipts
      tags:
        - Deals
      security: []
      parameters:
        - name: dealId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Receipt list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealReceiptsResponse'
        "404":
          description: Deal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/support/messages:
    post:
      summary: Submit a public support inquiry
      description: Accepts and stores a public contact/support message for later handling.
      operationId: createSupportMessage
      tags:
        - Support
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupportMessageRequest"
      responses:
        "201":
          description: Message accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSupportMessageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/Error"

  /api/whistleblower/ratings:
    post:
      summary: Submit a whistleblower rating (tenant)
      description: Authenticated tenant submits a rating (1-5) and optional review text.
      operationId: createWhistleblowerRating
      tags:
        - Whistleblower
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWhistleblowerRatingRequest"
      responses:
        "201":
          description: Rating created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateWhistleblowerRatingResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/whistleblower/{id}/ratings:
    get:
      summary: List whistleblower ratings
      description: Public list of ratings for profile/dashboard display.
      operationId: listWhistleblowerRatings
      tags:
        - Whistleblower
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Ratings list
          content:
            application/json:
              schema:
                type: object
                required: [success, ratings]
                properties:
                  success:
                    type: boolean
                  ratings:
                    type: array
                    items:
                      $ref: "#/components/schemas/WhistleblowerRating"
        "400":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/Error"

  /api/whistleblower/{id}/ratings/aggregate:
    get:
      summary: Get whistleblower rating aggregate
      description: Public aggregate trust metrics (count, average, breakdown).
      operationId: getWhistleblowerRatingAggregate
      tags:
        - Whistleblower
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Aggregate metrics
          content:
            application/json:
              schema:
                type: object
                required: [success, aggregate]
                properties:
                  success:
                    type: boolean
                  aggregate:
                    $ref: "#/components/schemas/WhistleblowerRatingAggregate"
        "400":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/Error"

  /soroban/config:
    get:
      summary: Get Soroban configuration
      description: Returns the current Soroban blockchain configuration
      operationId: getSorobanConfig
      tags:
        - Soroban
      security: []
      responses:
        "200":
          description: Soroban configuration retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - rpcUrl
                  - networkPassphrase
                  - contractId
                properties:
                  rpcUrl:
                    type: string
                    format: uri
                    example: "https://soroban-testnet.stellar.org"
                  networkPassphrase:
                    type: string
                    example: "Test SDF Network ; September 2015"
                  contractId:
                    type: string
                    nullable: true
                    example: null
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"

  /api/whistleblower/{id}/earnings:
    get:
      summary: Get whistleblower earnings
      description: Returns aggregated earnings totals and detailed history of individual rewards for a whistleblower
      operationId: getWhistleblowerEarnings
      tags:
        - Whistleblower
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the whistleblower
          schema:
            type: string
            minLength: 1
          example: "wb-123e4567-e89b-12d3-a456-426614174000"
      responses:
        "200":
          description: Earnings data retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EarningsResponse"
              examples:
                mixedStatus:
                  summary: Whistleblower with mixed payout statuses
                  value:
                    totals:
                      totalNgn: 750000
                      pendingNgn: 450000
                      paidNgn: 300000
                      totalUsdc: 500
                      pendingUsdc: 300
                      paidUsdc: 200
                    history:
                      - rewardId: "rw-001"
                        listingId: "lst-456"
                        dealId: "deal-789"
                        amountNgn: 300000
                        amountUsdc: 200
                        status: "paid"
                        createdAt: "2024-01-15T10:30:00Z"
                        paidAt: "2024-01-20T14:45:00Z"
                      - rewardId: "rw-002"
                        listingId: "lst-457"
                        dealId: "deal-790"
                        amountNgn: 225000
                        amountUsdc: 150
                        status: "pending"
                        createdAt: "2024-01-10T08:15:00Z"
                      - rewardId: "rw-003"
                        listingId: "lst-458"
                        dealId: "deal-791"
                        amountNgn: 225000
                        amountUsdc: 150
                        status: "payable"
                        createdAt: "2024-01-05T16:20:00Z"
                allPending:
                  summary: Whistleblower with all pending rewards
                  value:
                    totals:
                      totalNgn: 600000
                      pendingNgn: 600000
                      paidNgn: 0
                      totalUsdc: 400
                      pendingUsdc: 400
                      paidUsdc: 0
                    history:
                      - rewardId: "rw-004"
                        listingId: "lst-459"
                        dealId: "deal-792"
                        amountNgn: 300000
                        amountUsdc: 200
                        status: "pending"
                        createdAt: "2024-02-01T12:00:00Z"
                      - rewardId: "rw-005"
                        listingId: "lst-460"
                        dealId: "deal-793"
                        amountNgn: 300000
                        amountUsdc: 200
                        status: "pending"
                        createdAt: "2024-01-28T09:30:00Z"
        "400":
          description: Invalid request - whistleblower ID format is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "VALIDATION_ERROR"
                  message: "Whistleblower ID is required"
                  details:
                    field: "id"
        "404":
          description: Whistleblower not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "NOT_FOUND"
                  message: "Whistleblower not found"
                  details:
                    whistleblowerId: "wb-nonexistent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "INTERNAL_ERROR"
                  message: "Failed to retrieve earnings data"

  /api/whistleblower/listings:
    post:
      summary: Create a new listing
      description: |
        Create a new property listing. 
        
        Rules:
        - Address is required
        - Annual rent must be greater than 0
        - At least 3 photos are required
        - Maximum 2 listings per whistleblower per month
      operationId: createListing
      tags:
        - Whistleblower
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateListingRequest'
      responses:
        '201':
          description: Listing created successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - listing
                properties:
                  success:
                    type: boolean
                    example: true
                  listing:
                    $ref: '#/components/schemas/Listing'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingPhotos:
                  summary: Missing required photos
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Invalid request data
                      details:
                        fields:
                          - field: photos
                            message: At least 3 photos are required
                invalidRent:
                  summary: Invalid annual rent
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Invalid request data
                      details:
                        fields:
                          - field: annualRentNgn
                            message: Annual rent must be greater than 0
        '429':
          description: Monthly limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: CONFLICT
                  message: Monthly listing limit reached
                  details:
                    currentCount: 2
                    maxAllowed: 2
                    message: You have reached the maximum of 2 listings per month
        default:
          $ref: '#/components/responses/Error'

    get:
      summary: List listings
      description: Get a paginated list of listings with optional filters
      operationId: listListings
      tags:
        - Whistleblower
      security: []
      parameters:
        - name: status
          in: query
          description: Filter by listing status
          required: false
          schema:
            $ref: '#/components/schemas/ListingStatus'
        - name: query
          in: query
          description: Search term for address, city, area, or description
          required: false
          schema:
            type: string
            example: Lagos
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: pageSize
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            example: 20
      responses:
        '200':
          description: Listings retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - listings
                  - pagination
                properties:
                  success:
                    type: boolean
                    example: true
                  listings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Listing'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'

  /api/wallet/ngn/balance:
    get:
      summary: Get the NGN wallet balance
      description: |
        Available, held and total NGN for the caller, computed from the wallet ledger. Amounts are whole naira (numbers).
      operationId: getNgnBalance
      tags:
        - Wallet
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NgnBalanceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'


  /api/wallet/ngn/ledger:
    get:
      summary: List NGN ledger entries
      description: |
        The caller's ledger entries, newest first. `amountNgn` is signed: reservations and debits are negative. `nextCursor` is currently always null: only the first `limit` entries are returned.
      operationId: getNgnLedger
      tags:
        - Wallet
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Ledger entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NgnLedgerResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'


  /api/wallet/ngn/withdraw/history:
    get:
      summary: List the caller's withdrawals
      description: |
        The caller's NGN withdrawals, newest first, with their status. Page with `limit` and `cursor`.
      operationId: getNgnWithdrawalHistory
      tags:
        - Wallet
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Withdrawals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'


  /api/wallet/address:
    get:
      summary: Get the custodial wallet address
      description: |
        The Stellar address of the caller's custodial wallet. 403 when custodial mode is disabled; 401 when the caller has no wallet yet.
      operationId: getWalletAddress
      tags:
        - Wallet
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Wallet address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletAddressResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'


  /api/wallet/create:
    post:
      summary: Create the custodial wallet
      description: |
        Creates a custodial wallet for the caller if they do not have one and returns its address. 403 when custodial mode is disabled.
      operationId: createWallet
      tags:
        - Wallet
      security:
