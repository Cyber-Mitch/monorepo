        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'


  /api/staking/stake_from_deposit:
    post:
      summary: Stake the USDC from a converted deposit
      description: |
        Stakes the USDC amount produced by a deposit conversion. The conversion must be completed (409 otherwise) and exist (404). Idempotent by deposit. 200 when the receipt was written, 202 when it was queued for retry. The implementation does not authenticate the caller: it is meant for trusted services.
      operationId: stakeFromDeposit
      tags:
        - Staking
      security: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: A UUID. Retrying with the same key and body replays the first response; the same key with a different body is 409. The legacy `x-idempotency-key` header is also accepted.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversionId]
              properties:
                conversionId: { type: string, minLength: 1, description: Conversion id returned by deposit confirmation }
      responses:
        '200':
          description: Staked and receipt written
