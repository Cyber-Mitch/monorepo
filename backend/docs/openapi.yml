  responses:
    Forbidden:
      description: Caller lacks the required permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: "FORBIDDEN"
              message: "Forbidden"

    NotFound:
      description: Resource not found (also returned for resources owned by someone else)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: "NOT_FOUND"
              message: "Not found"

    Conflict:
      description: Request conflicts with current state (duplicate submission or invalid status transition)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: "INVALID_STATE_TRANSITION"
              message: "Cannot bind a policy that is cancelled"

    InspectionForbidden:
      description: Caller lacks the required permission, is not a verified inspector, or is not the assigned inspector
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: "FORBIDDEN"
              message: "Only verified inspectors can perform this action"

    InspectionNotFound:
      description: Inspection or listing not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: "NOT_FOUND"
              message: "Inspection not found"

    InspectionInvalidTransition:
      description: The inspection's current status does not allow this action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: "INVALID_STATE_TRANSITION"
              message: "Cannot submit an inspection with status 'pending'"
              details:
                status: pending

    Error:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: "TOO_MANY_REQUESTS"
              message: "Rate limit exceeded"

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: "VALIDATION_ERROR"
              message: "Request validation failed"
              details:
                fieldErrors:
                  - field: "email"
                    message: "Invalid email address"

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: "UNAUTHORIZED"
              message: "Authentication required"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
      description: >-
        Ordinary authenticated-session bearer token (authenticateToken middleware only —
        no elevated role/permission required).
    bearerAdminAuth:
      type: http
      scheme: bearer
      bearerFormat: token
      description: >-
        Same bearer token as bearerAuth, but the route additionally requires the caller's
        session to carry an admin-tier RBAC permission (requirePermission(resource, action)
        in middleware/rbac.ts, e.g. payouts:trigger) or an explicit admin/super_admin role
        check. Kept as a distinct scheme name so admin-gated operations are visibly
        distinguishable from ordinary authenticated ones in this document.
    adminSecret:
      type: apiKey
      in: header
      name: x-admin-secret
      description: >-
        Deprecated shared operator secret checked against MANUAL_ADMIN_SECRET. The admin routes
        no longer accept it unless ALLOW_LEGACY_ADMIN_SECRET=true is set (off by default); each
        use is logged as a warning. Use an admin bearer token with the route's permission.
    webhookSignature:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: >-
        Provider-specific HMAC signature header verified server-side instead of a bearer
        token (e.g. x-paystack-signature for Paystack, verif-hash for Flutterwave). The
        header name varies by payment rail; see the payments webhook handler.

  /api/landlord/payout/preferences:
    patch:
      summary: Update landlord payout schedule preference
      operationId: updateLandlordPayoutPreference
      tags:
        - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - schedule
              properties:
                schedule:
                  type: string
                  enum: [activation, weekly, monthly]
      responses:
        '200':
          description: Payout preference updated
        '400':
          description: Invalid schedule preference
        '401':
          description: Authentication required

