[workspace]
resolver = "2"
members = [
  "rent_wallet",
  "rent_payments",
  "transaction-receipt-contract",
  "staking_rewards",
  "staking_pool",
  "mvp_staking_pool",
  "whistleblower_rewards",
  "soroban_pausable",
  "soroban_access_control",
  "deal_escrow",
  "contract_access",
  "timelock",
  "rent_schedule",

  "bond_collateral",
  "slashing_module",
  "schema_registry",
  "multisig_admin",
  "tenant_reputation",
]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
